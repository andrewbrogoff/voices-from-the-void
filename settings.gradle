pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
    // mc-agent-harness is optional and local: it has no public remote yet, so CI runs without it.
    // Set harness.dir in the ignored local.properties to build its plugin for local E2E runs.
    def local = new Properties()
    def localFile = file('local.properties')
    if (localFile.exists()) {
        localFile.withInputStream { local.load(it) }
    }
    def harnessDir = local.getProperty('harness.dir')
    if (harnessDir) {
        includeBuild(harnessDir)
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'vftv'

// Also a regular included build, so build.gradle's classpath and the plugin's own dependencies
// (companion mod, CLI) substitute from it. build.gradle applies the plugin only when this is set.
def harnessLocal = new Properties()
if (file('local.properties').exists()) {
    file('local.properties').withInputStream { harnessLocal.load(it) }
}
if (harnessLocal.getProperty('harness.dir')) {
    includeBuild(harnessLocal.getProperty('harness.dir'))
    gradle.ext.harnessDir = harnessLocal.getProperty('harness.dir')
}
