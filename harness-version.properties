# The mc-agent-harness commit these E2E scenarios are tested against (quality gates, "CI": CI checks
# out this repository at this full SHA in every job that configures Gradle). The harness has no
# public remote yet; until the owner publishes it, CI runs without it.
#
# Local runs: set harness.dir=<absolute path to a checkout at this commit> in local.properties, then
#   ./gradlew runHarnessScenario                                         (harness-scenarios/boot.json)
#   ./gradlew runHarnessScenario -PharnessScenario=harness-scenarios/lan.json
#   ./gradlew runHarnessScenario -PharnessScenario=<scenario> -PharnessCheck=harness-results/<run>
# Every scenario directly under harness-scenarios/ is an E2E scenario. The reference stress world is
# harness-scenarios/reference/stress-build.json, then stress-measure.json (reference machine only);
# the build includes every feature's workload fragment, harness-scenarios/stress/<f>.json.
